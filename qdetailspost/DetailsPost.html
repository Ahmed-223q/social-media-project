<!doctype html>
<html lang="ar" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Details - FaceNote</title>

    <!-- Bootstrap Icons & Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Custom Modern Design System -->
    <link rel="stylesheet" href="../style.css" />
  </head>

  <body>
    <!-- Live Alerts Container -->
    <div id="liveAlertPlaceholder"></div>

    <!-- Modals -->

    <!-- Login Modal -->
    <div
      class="modal fade"
      id="loginModal"
      tabindex="-1"
      aria-labelledby="loginModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="loginModalLabel">
              <i class="bi bi-box-arrow-in-right text-primary me-2"></i>تسجيل الدخول
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form onsubmit="event.preventDefault(); loginBtnClick();">
              <div class="mb-3">
                <label for="username-input" class="form-label">اسم المستخدم (Username)</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                  <input
                    type="text"
                    class="form-control"
                    id="username-input"
                    placeholder="مثال: ahmed123"
                    required
                  />
                </div>
              </div>
              <div class="mb-3">
                <label for="password-input" class="form-label">كلمة المرور (Password)</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                  <input
                    type="password"
                    class="form-control"
                    id="password-input"
                    placeholder="••••••••"
                    required
                  />
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-light"
              data-bs-dismiss="modal"
            >
              إلغاء
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="loginBtnClick()"
            >
              دخول
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Register Modal -->
    <div
      class="modal fade"
      id="RegisterModal"
      tabindex="-1"
      aria-labelledby="registerModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="registerModalLabel">
              <i class="bi bi-person-plus text-primary me-2"></i>إنشاء حساب جديد
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form onsubmit="event.preventDefault(); RegisterBtnClick();">
              <div class="mb-3">
                <label for="re-name-input" class="form-label">الاسم الكامل (Full Name)</label>
                <input
                  type="text"
                  class="form-control"
                  id="re-name-input"
                  placeholder="مثال: أحمد إبراهيم"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="re-username-input" class="form-label">اسم المستخدم (Username)</label>
                <input
                  type="text"
                  class="form-control"
                  id="re-username-input"
                  placeholder="مثال: ahmed_dev"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="re-password-input" class="form-label">كلمة المرور (Password)</label>
                <input
                  type="password"
                  class="form-control"
                  id="re-password-input"
                  placeholder="••••••••"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="re-image-input" class="form-label">صورة الحساب (اختياري)</label>
                <input type="file" class="form-control" id="re-image-input" accept="image/*" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-light"
              data-bs-dismiss="modal"
            >
              إلغاء
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="RegisterBtnClick()"
            >
              إنشاء الحساب
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Create Post Modal -->
    <div
      class="modal fade"
      id="createNewPost"
      tabindex="-1"
      aria-labelledby="createPostModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="createPostModalLabel">
              <i class="bi bi-pencil-square text-primary me-2"></i>إضافة منشور جديد
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form onsubmit="event.preventDefault(); createNewPostList();">
              <div class="mb-3">
                <label for="post-title-input" class="form-label">عنوان المنشور</label>
                <input
                  type="text"
                  class="form-control"
                  id="post-title-input"
                  placeholder="اكتب عنواناً جذاباً..."
                />
              </div>
              <div class="mb-3">
                <label for="post-body-input" class="form-label">محتوى المنشور</label>
                <textarea
                  class="form-control"
                  id="post-body-input"
                  rows="4"
                  placeholder="ما الذي يدور في ذهنك؟"
                  required
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="post-image-input" class="form-label">إرفاق صورة</label>
                <input type="file" class="form-control" id="post-image-input" accept="image/*" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-light"
              data-bs-dismiss="modal"
            >
              إلغاء
            </button>
            <button
              type="button"
              class="btn btn-primary px-4"
              onclick="createNewPostList()"
            >
              <i class="bi bi-send me-1"></i>نشر
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Post Modal -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="editModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="editModalLabel">
              <i class="bi bi-pencil text-primary me-2"></i>تعديل المنشور
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form onsubmit="event.preventDefault(); updataPost();">
              <div class="mb-3">
                <label for="editTitle" class="form-label">العنوان</label>
                <input type="text" class="form-control" id="editTitle" />
              </div>
              <div class="mb-3">
                <label for="editBody" class="form-label">المحتوى</label>
                <textarea class="form-control" id="editBody" rows="4" required></textarea>
              </div>
              <div class="mb-3">
                <label for="editImage" class="form-label">تغيير الصورة</label>
                <input type="file" class="form-control" id="editImage" accept="image/*" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-light"
              data-bs-dismiss="modal"
            >
              إلغاء
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="updataPost()"
            >
              حفظ التعديلات
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Post Modal -->
    <div
      class="modal fade"
      id="DeleteModal"
      tabindex="-1"
      aria-labelledby="DeleteModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="DeleteModalLabel">
              <i class="bi bi-exclamation-triangle text-danger me-2"></i>تأكيد الحذف
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p class="mb-0 text-secondary">هل أنت متأكد من رغبتك في حذف هذا المنشور؟ لا يمكن التراجع عن هذه العملية.</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-light"
              data-bs-dismiss="modal"
            >
              إلغاء
            </button>
            <button type="button" class="btn btn-outline-danger" onclick="deletePost()">
              <i class="bi bi-trash3 me-1"></i>نعم، احذف
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Floating Add Post Button (FAB) -->
    <div
      id="addBtn"
      type="button"
      data-bs-target="#createNewPost"
      data-bs-toggle="modal"
      title="إضافة منشور جديد"
      style="display: none;"
    >
      <i class="bi bi-plus-lg"></i>
    </div>

    <!-- Main Navigation Bar -->
    <div class="app-navbar-container">
      <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container-fluid px-0">
          <a class="navbar-brand" href="../index.html">
            <span class="brand-icon"><i class="bi bi-chat-heart-fill"></i></span>
            <span>FaceNote</span>
          </a>
          <button
            class="navbar-toggler border-0 shadow-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse justify-content-between align-items-center mt-2 mt-lg-0"
            id="navbarNav"
          >
            <ul class="navbar-nav mb-2 mb-lg-0 gap-1">
              <li class="nav-item">
                <a class="nav-link" href="../index.html">
                  <i class="bi bi-house-door me-1"></i>Home
                </a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="javascript:void(0)"
                  onclick="profileNavClicked()"
                >
                  <i class="bi bi-person me-1"></i>Profile
                </a>
              </li>
            </ul>

            <!-- Login / Register Buttons -->
            <div id="loginBtnDiv" class="d-flex gap-2">
              <button
                type="button"
                class="btn btn-outline-primary btn-sm px-3"
                data-bs-toggle="modal"
                data-bs-target="#loginModal"
                id="loginBtn"
              >
                <i class="bi bi-box-arrow-in-right me-1"></i>Login
              </button>
              <button
                type="button"
                data-bs-target="#RegisterModal"
                data-bs-toggle="modal"
                class="btn btn-primary btn-sm px-3"
                id="registerBtn"
              >
                <i class="bi bi-person-plus me-1"></i>Register
              </button>
            </div>

            <!-- Logout & User Info Pill -->
            <div
              style="display: none;"
              class="align-items-center gap-3"
              id="logoutBtnDiv"
            >
              <div
                class="user-nav-badge"
                onclick="profileNavClicked()"
                title="عرض حسابي"
              >
                <img
                  src=""
                  alt=""
                  id="userImage"
                  onerror="this.src = '../profile-pics/user.png'"
                />
                <b id="userName"></b>
              </div>
              <button
                type="button"
                class="btn btn-outline-danger btn-sm px-3"
                onclick="logout()"
              >
                <i class="bi bi-box-arrow-right me-1"></i>Logout
              </button>
            </div>
          </div>
        </div>
      </nav>
    </div>

    <!-- Post Details Container -->
    <div class="container px-3 mb-5">
      <div class="post-card-container">
        <!-- Post Creator Header / Back Navigation -->
        <div class="d-flex align-items-center justify-content-between mb-3 px-1">
          <a href="../index.html" class="btn btn-sm btn-light-action">
            <i class="bi bi-arrow-left me-1"></i>الرجوع للمنشورات
          </a>
          <h5 id="postCreator" class="mb-0 text-muted fw-bold">
            منشور المستخدم
          </h5>
        </div>

        <div id="postDeatils">
          <!-- Dynamic details content injected by JS -->
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../main.js"></script>
  </body>
</html>
