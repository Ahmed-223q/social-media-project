<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Details</title>
    <!-- Bootstrap Icons & Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <style>
      :root {
        --primary-color: #4f46e5;
        --primary-hover: #4338ca;
        --bg-page: #f8fafc;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --text-dark: #0f172a;
        --text-muted: #64748b;
        --tag-bg: #eef2ff;
        --tag-text: #4f46e5;
        --tag-border: #c7d2fe;
      }

      body {
        background-color: var(--bg-page) !important;
        color: var(--text-dark);
      }

      /* Navbar & Brand */
      .navbar-brand {
        color: var(--primary-color) !important;
        font-weight: 700 !important;
      }

      .nav-link.active,
      .nav-link:hover {
        color: var(--primary-color) !important;
      }

      /* Buttons */
      .btn-primary {
        background-color: var(--primary-color) !important;
        border-color: var(--primary-color) !important;
      }

      .btn-primary:hover {
        background-color: var(--primary-hover) !important;
        border-color: var(--primary-hover) !important;
      }

      .btn-outline-success {
        color: var(--primary-color) !important;
        border-color: var(--primary-color) !important;
      }

      .btn-outline-success:hover {
        background-color: var(--primary-color) !important;
        border-color: var(--primary-color) !important;
        color: #ffffff !important;
      }

      .btn-outline-danger {
        color: #ef4444 !important;
        border-color: #fca5a5 !important;
      }

      .btn-outline-danger:hover {
        background-color: #ef4444 !important;
        border-color: #ef4444 !important;
        color: #ffffff !important;
      }

      /* Cards */
      .card {
        background-color: var(--card-bg) !important;
        border: 1px solid var(--card-border) !important;
        border-radius: 16px !important;
        box-shadow: 0 4px 15px rgba(15, 23, 42, 0.04) !important;
      }

      .card-header {
        background-color: var(--card-bg) !important;
        border-bottom: 1px solid var(--card-border) !important;
        border-top-left-radius: 16px !important;
        border-top-right-radius: 16px !important;
      }

      /* Add Post Floating Button */
      #addBtn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        height: 52px;
        width: 52px;
        background-color: var(--primary-color) !important;
        color: #fff;
        border-radius: 50%;
        font-size: 32px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 8px 24px rgba(79, 70, 229, 0.38);
        border: 2px solid #ffffff;
        z-index: 999;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      #addBtn:hover {
        transform: scale(1.08);
        box-shadow: 0 12px 28px rgba(79, 70, 229, 0.48);
      }

      /* Badges & Tags */
      .badge.bg-secondary {
        background-color: var(--tag-bg) !important;
        color: var(--tag-text) !important;
        border: 1px solid var(--tag-border) !important;
        font-weight: 600 !important;
      }

      .text-primary {
        color: var(--primary-color) !important;
      }

      /* Modals */
      .modal-content {
        border-radius: 16px !important;
        border: 1px solid var(--card-border) !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1) !important;
      }
    </style>
  </head>
  <body>
    <!-- login alert -->
    <div
      id="liveAlertPlaceholder"
      style="position: fixed; right: 20px; bottom: 20px; z-index: 10000"
    ></div>
    <!-- ## login alert ## -->

    <!-- modals -->
    <!-- modal of login -->
    <div
      class="modal fade"
      id="loginModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Login</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="username-input" class="col-form-label"
                  >Username:</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="username-input"
         
                />
              </div>
              <div class="mb-3">
                <label for="password-input" class="col-form-label"
                  >Password:</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="password-input"
       
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="loginBtnClick()"
            >
              Login
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- ## modal of login ## -->

    <!-- modal of Register -->
    <div
      class="modal fade"
      id="RegisterModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Register a new user
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="re-name-input" class="col-form-label">Name:</label>
                <input type="text" class="form-control" id="re-name-input" />
              </div>
              <div class="mb-3">
                <label for="re-username-input" class="col-form-label"
                  >Username:</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="re-username-input"
                />
              </div>
              <div class="mb-3">
                <label for="re-password-input" class="col-form-label"
                  >Password:</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="re-password-input"
                />
              </div>
              <div class="mb-3">
                <label for="re-image-input" class="col-form-label"
                  >Profile Image:</label
                >
                <input type="file" class="form-control" id="re-image-input" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="RegisterBtnClick()"
            >
              Register
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- ## modal of Register ## -->

    <!-- modal to edit post -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="editModalLabel">Edit Post</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="editTitle" class="col-form-label">Title:</label>
                <input type="text" class="form-control" id="editTitle" />
              </div>
              <div class="mb-3">
                <label for="editBody" class="col-form-label">Body:</label>
                <textarea class="form-control" id="editBody"></textarea>
              </div>
              <div class="mb-3">
                <label for="editImage" class="col-form-label">Image:</label>
                <input type="file" class="form-control" id="editImage" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="updataPost()"
            >
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- ## modal to edit post ## -->

    <!-- modal to delete post -->
    <div
      class="modal fade"
      id="DeleteModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="DeleteModalLabel">Delete Post</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p>Are you sure you want to delete this post?</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-danger" onclick="deletePost()">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- ## modal to delete post ## -->

    <!-- modal create new post -->
    <div
      class="modal fade"
      id="createNewPost"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Add new post
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="post-title-input" class="col-form-label"
                  >Title:</label
                >
                <input type="text" class="form-control" id="post-title-input" />
              </div>
              <div class="mb-3">
                <label for="post-body-input" class="col-form-label"
                  >Body:</label
                >
                <textarea class="form-control" id="post-body-input"></textarea>
              </div>
              <div class="mb-3">
                <label for="post-image-input" class="col-form-label"
                  >Image:</label
                >
                <input type="file" class="form-control" id="post-image-input" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="createNewPostList()"
            >
              Add
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- ## modal create new post ## -->

    <!-- add new post floating button -->
    <div
      class="bg-primary"
      id="addBtn"
      type="button"
      data-bs-target="#createNewPost"
      data-bs-toggle="modal"
    >
      <i class="bi bi-plus"></i>
    </div>
    <!-- ## add new post floating button ## -->

    <!-- start container -->
    <div class="container mb-4">
      <!-- start navbar -->
      <div class="container shadow-sm p-1 mb-4 bg-body-tertiary rounded mt-1">
        <div class="m-auto">
          <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
              <a class="navbar-brand" href="../index.html">FaceNote</a>
              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>
              <div
                class="collapse navbar-collapse w-100 justify-content-between align-center"
                id="navbarNav"
              >
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link" href="../index.html">Home</a>
                  </li>
                  <li class="nav-item">
                    <a
                      class="nav-link"
                      href="javascript:void(0)"
                      onclick="profileNavClicked()"
                      >Profile</a
                    >
                  </li>
                </ul>
                <!-- login button -->
                <div id="loginBtnDiv">
                  <button
                    type="button"
                    class="btn btn-outline-success me-2"
                    data-bs-toggle="modal"
                    data-bs-target="#loginModal"
                    id="loginBtn"
                  >
                    login
                  </button>
                  <button
                    type="button"
                    data-bs-target="#RegisterModal"
                    data-bs-toggle="modal"
                    class="btn btn-outline-success"
                    id="registerBtn"
                  >
                    Register
                  </button>
                </div>
                <!-- ## login button -->
                <!-- logout button -->
                <div
                  style="
                    display: none;
                    justify-content: center;
                    align-items: center;
                    gap: 10px;
                  "
                  id="logoutBtnDiv"
                >
                  <div
                    onclick="profileNavClicked()"
                    style="
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      gap: 8px;
                    "
                    title="عرض حسابي"
                  >
                    <b style="font-size: 1.2rem" id="userName"></b>
                    <img
                      src=""
                      alt=""
                      style="
                        width: 40px;
                        height: 40px;
                        border-radius: 50%;
                        object-fit: cover;
                      "
                      id="userImage"
                      onerror="this.src = '../profile-pics/user.png'"
                    />
                  </div>
                  <button
                    type="button"
                    class="btn btn-outline-danger"
                    onclick="logout()"
                  >
                    logout
                  </button>
                </div>
                <!-- ## logout button -->
              </div>
            </div>
          </nav>
        </div>
      </div>
      <!-- ## end navbar ## -->

      <!-- user post Details -->
      <div class="col-12 col-md-9 m-auto mb-4">
        <h2 id="postCreator" class="text-secondary fw-bold">
          <span>User</span>'s Post
        </h2>
      </div>
      <div id="postDeatils">
        <!-- content will be inserted here from js -->
      </div>
      <!-- ## end post details ## -->
    </div>
    <!-- ## end container ## -->

    <!-- Axios, Bootstrap Bundle, Main JS -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../main.js"></script>
  </body>
</html>
