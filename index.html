<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaceNote</title>
    <!-- Bootstrap Icons & Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- FaceNote Unified Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Live Toast Alerts Placeholder -->
    <div id="liveAlertPlaceholder"></div>

    <!-- ==========================================
         Modals
         ========================================== -->

    <!-- Login Modal -->
    <div
      class="modal fade"
      id="loginModal"
      tabindex="-1"
      aria-labelledby="loginModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="loginModalLabel">Login</h1>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form onsubmit="event.preventDefault(); loginBtnClick();">
              <div class="mb-3">
                <label for="username-input" class="col-form-label">Username:</label>
                <input
                  type="text"
                  class="form-control shadow-none"
                  id="username-input"
                  placeholder="e.g. ahmed_dev"
                />
                <div id="login-username-error" class="text-danger small mt-1" style="display: none;"></div>
              </div>
              <div class="mb-3">
                <label for="password-input" class="col-form-label">Password:</label>
                <input
                  type="password"
                  class="form-control shadow-none"
                  id="password-input"
                  placeholder="Enter your password"
                />
                <div id="login-password-error" class="text-danger small mt-1" style="display: none;"></div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary" onclick="loginBtnClick()">Login</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Register Modal -->
    <div
      class="modal fade"
      id="RegisterModal"
      tabindex="-1"
      aria-labelledby="registerModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="registerModalLabel">Register a New User</h1>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form onsubmit="event.preventDefault(); RegisterBtnClick();">
              <div class="mb-3">
                <label for="re-name-input" class="col-form-label">Full Name:</label>
                <input
                  type="text"
                  class="form-control shadow-none"
                  id="re-name-input"
                  placeholder="e.g. Ahmed Ibrahim"
                />
                <div id="re-name-error" class="text-danger small mt-1" style="display: none;"></div>
              </div>
              <div class="mb-3">
                <label for="re-username-input" class="col-form-label">Username:</label>
                <input
                  type="text"
                  class="form-control shadow-none"
                  id="re-username-input"
                  placeholder="e.g. ahmed_2024 (letters & numbers)"
                />
                <div id="re-username-error" class="text-danger small mt-1" style="display: none;"></div>
              </div>
              <div class="mb-3">
                <label for="re-password-input" class="col-form-label">Password:</label>
                <input
                  type="password"
                  class="form-control shadow-none"
                  id="re-password-input"
                  placeholder="At least 6 characters"
                />
                <div id="re-password-error" class="text-danger small mt-1" style="display: none;"></div>
              </div>
              <div class="mb-3">
                <label for="re-image-input" class="col-form-label">Profile Picture (Optional):</label>
                <input type="file" class="form-control shadow-none" id="re-image-input" accept="image/*" />
                <div id="re-image-error" class="text-danger small mt-1" style="display: none;"></div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary" onclick="RegisterBtnClick()">Register</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Create Post Modal -->
    <div
      class="modal fade"
      id="createNewPost"
      tabindex="-1"
      aria-labelledby="createNewPostLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="createNewPostLabel">Add New Post</h1>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form onsubmit="event.preventDefault(); createNewPostList();">
              <div class="mb-3">
                <label for="post-title-input" class="col-form-label">Title:</label>
                <input
                  type="text"
                  class="form-control shadow-none"
                  id="post-title-input"
                  placeholder="e.g. Exciting announcement!"
                />
                <div id="post-title-error" class="text-danger small mt-1" style="display: none;"></div>
              </div>
              <div class="mb-3">
                <label for="post-body-input" class="col-form-label">Content:</label>
                <textarea
                  class="form-control shadow-none"
                  id="post-body-input"
                  rows="4"
                  placeholder="What's on your mind?"
                ></textarea>
                <div id="post-body-error" class="text-danger small mt-1" style="display: none;"></div>
              </div>
              <div class="mb-3">
                <label for="post-image-input" class="col-form-label">Image (Optional):</label>
                <input type="file" class="form-control shadow-none" id="post-image-input" accept="image/*" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary" onclick="createNewPostList()">Publish</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Post Modal -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="editModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="editModalLabel">Edit Post</h1>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form onsubmit="event.preventDefault(); updataPost();">
              <div class="mb-3">
                <label for="editTitle" class="col-form-label">Title:</label>
                <input type="text" class="form-control shadow-none" id="editTitle" />
                <div id="edit-title-error" class="text-danger small mt-1" style="display: none;"></div>
              </div>
              <div class="mb-3">
                <label for="editBody" class="col-form-label">Content:</label>
                <textarea class="form-control shadow-none" id="editBody" rows="4"></textarea>
                <div id="edit-body-error" class="text-danger small mt-1" style="display: none;"></div>
              </div>
              <div class="mb-3">
                <label for="editImage" class="col-form-label">Image (Optional):</label>
                <input type="file" class="form-control shadow-none" id="editImage" accept="image/*" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary" onclick="updataPost()">Save Changes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Post Modal -->
    <div
      class="modal fade"
      id="DeleteModal"
      tabindex="-1"
      aria-labelledby="DeleteModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="DeleteModalLabel">Delete Post</h1>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="mb-0">Are you sure you want to delete this post? This action cannot be undone.</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" onclick="deletePost()">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Floating Action Button: Add Post -->
    <div
      id="addBtn"
      type="button"
      data-bs-target="#createNewPost"
      data-bs-toggle="modal"
      title="Add New Post"
    >
      <i class="bi bi-plus"></i>
    </div>

    <!-- ==========================================
         Main Layout & Navigation
         ========================================== -->
    <div class="container mb-4">
      <!-- Navbar -->
      <div class="container shadow-sm p-1 mb-4 bg-white rounded-4 mt-2 border">
        <div class="m-auto">
          <nav class="navbar navbar-expand-lg bg-white">
            <div class="container-fluid">
              <a class="navbar-brand" href="./index.html">FaceNote</a>
              <button
                class="navbar-toggler shadow-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>
              <div
                class="collapse navbar-collapse w-100 justify-content-between align-items-center"
                id="navbarNav"
              >
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)" onclick="profileNavClicked()">Profile</a>
                  </li>
                </ul>

                <!-- Auth Controls -->
                <div class="d-flex align-items-center gap-2">
                  <!-- Guest: Login / Register -->
                  <div id="loginBtnDiv" style="display: flex; align-items: center; gap: 8px;">
                    <button
                      type="button"
                      class="btn btn-outline-success"
                      data-bs-toggle="modal"
                      data-bs-target="#loginModal"
                      id="loginBtn"
                    >
                      Login
                    </button>
                    <button
                      type="button"
                      data-bs-target="#RegisterModal"
                      data-bs-toggle="modal"
                      class="btn btn-outline-success"
                      id="registerBtn"
                    >
                      Register
                    </button>
                  </div>

                  <!-- Logged In: User Badge & Logout -->
                  <div
                    id="logoutBtnDiv"
                    style="display: none; justify-content: center; align-items: center; gap: 10px;"
                  >
                    <div
                      onclick="profileNavClicked()"
                      style="cursor: pointer; display: flex; align-items: center; gap: 8px;"
                      title="View My Profile"
                    >
                      <b style="font-size: 1.05rem" id="userName"></b>
                      <img
                        src=""
                        alt=""
                        style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover;"
                        id="userImage"
                        onerror="this.src = './profile-pics/user.png'"
                      />
                    </div>
                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="logout()">
                      Logout
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </nav>
        </div>
      </div>

      <!-- Feed Container -->
      <div class="container" id="container" style="width: 100%"></div>
    </div>

    <!-- Scripts: Axios, Bootstrap Bundle, Application Logic -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="main.js"></script>
  </body>
</html>
